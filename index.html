<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Descargas Musica - Convertidor de Video a MP3 y MP4</title>

    <meta name="description"
          content="Descargas Musica te permite convertir tus propios videos a MP3 y MP4 de forma rápida y sencilla. Elige formato, calidad y descarga tu archivo.">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Descargas Musica</div>

    <div class="language-dropdown">
        <select id="languageSelect">
            <option value="es">🌐 Español</option>
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
        </select>
    </div>
</header>

<main>

    <section class="hero">

        <span class="badge">Conversor rápido y sencillo</span>

        <h1>Descargas Musica</h1>

        <p>
            Convierte tus propios videos a MP3 o MP4 de forma rápida,
            sencilla y desde cualquier dispositivo.
        </p>

        <div class="converter-box">

            <h2>Convertidor de Video a MP3 y MP4</h2>

            <div class="input-wrap">
                <input
                    type="text"
                    placeholder="Pega un enlace permitido o selecciona tu video"
                >
            </div>

            <div class="formats">
                <button class="format-btn active">MP3</button>
                <button class="format-btn">MP4</button>
            </div>

            <button class="convert-button">
                Convertir ahora
            </button>

            <p class="small-note">
                Usa únicamente contenido propio o contenido que tengas permiso para convertir.
            </p>

        </div>

    </section>

</main>
    <script src="script.js"></script> 
</body>

</html>

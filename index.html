<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Descargas Musica - Convertidor de Video a MP3 y MP4</title>

    <meta name="description"
          content="Descargas Musica te permite convertir tus propios videos a MP3 y MP4 de forma rápida y sencilla. Elige formato, calidad y descarga tu archivo.">
</head>

<body>

    <header>

        <div class="logo">
            Descargas Musica
        </div>

        <div class="language-selector">
            🌐 Español
        </div>

    </header>


    <main>

        <section class="hero">

            <h1>Descargas Musica</h1>

            <p>
                Convierte tus videos a MP3 y MP4 de forma rápida,
                sencilla y desde cualquier dispositivo.
            </p>

            <div class="converter-box">

                <h2>Convertidor de Video a MP3 y MP4</h2>

                <input
                    type="text"
                    placeholder="Pega el enlace o selecciona tu video"
                >

                <div class="formats">

                    <button>MP3</button>

                    <button>MP4</button>

                </div>

                <button class="convert-button">
                    Convertir
                </button>

            </div>

        </section>

    </main>


</body>

</html>

<div class="link-converter-card">

    <h3>Convertir desde un enlace</h3>

    <p class="link-help">
        Pega un enlace público o multimedia compatible.
    </p>

    <input
        type="text"
        id="videoUrl"
        placeholder="Pega un enlace de TikTok, Instagram o video directo"
    >

    <div class="link-formats">
        <button type="button" class="link-format-btn active" data-format="mp3">
            MP3
        </button>

        <button type="button" class="link-format-btn" data-format="mp4">
            MP4
        </button>
    </div>

    <div class="link-quality-section">

        <label id="linkQualityLabel">
            Calidad MP3
        </label>

        <select id="linkQualitySelect">
            <option value="128">128 kbps</option>
            <option value="192">192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
        </select>

    </div>

    <button
        type="button"
        id="convertLinkButton"
        class="convert-link-button"
    >
        Convertir enlace
    </button>

    <div id="linkStatus" class="link-status"></div>

</div>
